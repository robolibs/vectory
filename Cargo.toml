[package]
name = "vectory"
version = "0.0.1"
edition = "2024"
description = "Rust GeoJSON vector library for robotics"
license = "MIT"
readme = "README.md"
publish = false
include = [
    "Cargo.toml",
    "pyproject.toml",
    "README.md",
    "include/**/*.h",
    "src/**/*.rs",
    "examples/**/*.rs",
    "tests/**/*.rs",
]

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3", "pyo3/abi3-py39", "pyo3/auto-initialize"]
python-extension = ["python", "pyo3/extension-module"]
# Enables the examples that depend on the optional `rerun` crate.
rerun-viz = ["dep:rerun"]

[[example]]
name = "rerun_vis_from_enu"
path = "examples/rerun_vis_from_enu.rs"
required-features = ["rerun-viz"]

[[example]]
name = "rerun_vis_from_wgs"
path = "examples/rerun_vis_from_wgs.rs"
required-features = ["rerun-viz"]

[dependencies]
concord = { git = "https://codeberg.org/robolibs/concord.git", tag = "0.1.0" }
datapod = { git = "https://codeberg.org/robolibs/datapod.git", tag = "0.2.0" }
graphix = { git = "https://codeberg.org/robolibs/graphix.git", tag = "0.1.0" }
geojson = "0.24"
pyo3 = { version = "0.23", optional = true }
rerun = { version = "0.31.2", default-features = false, features = ["sdk", "server"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
