[package]
name = "vectory"
version = "0.0.1"
edition = "2024"
description = "Rust GeoJSON vector library for robotics"
license = "MIT"
readme = "README.md"
publish = false
include = [
    "Cargo.toml",
    "pyproject.toml",
    "README.md",
    "include/**/*.h",
    "src/**/*.rs",
    "examples/**/*.rs",
    "tests/**/*.rs",
]

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3", "pyo3/abi3-py39", "pyo3/auto-initialize"]
python-extension = ["python", "pyo3/extension-module"]

[dependencies]
concord = { git = "https://codeberg.org/robolibs/concord.git" }
datapod = { git = "https://codeberg.org/robolibs/datapod.git" }
graphix = { git = "https://codeberg.org/robolibs/graphix.git" }
geojson = "0.24"
pyo3 = { version = "0.23", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
rerun = { version = "0.31.2", default-features = false, features = ["sdk", "server"] }
