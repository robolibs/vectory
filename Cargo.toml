[package]
name = "vectory"
version = "0.1.3"
edition = "2024"
description = "Rust GeoJSON vector library for robotics"
license = "MIT"
readme = "README.md"
publish = false
include = [
    "Cargo.toml",
    "pyproject.toml",
    "README.md",
    "include/**/*.h",
    "src/**/*.rs",
    "examples/**/*.rs",
    "tests/**/*.rs",
]

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3"]
python-extension = ["python"]
# Enables the examples that depend on the optional `rerun` crate.
rerun-viz = ["dep:rerun"]

[[example]]
name = "rerun_vis_from_enu"
path = "examples/rust/rerun_vis_from_enu.rs"
required-features = ["rerun-viz"]

[[example]]
name = "rerun_vis_from_wgs"
path = "examples/rust/rerun_vis_from_wgs.rs"
required-features = ["rerun-viz"]

[dependencies]
concord = { git = "https://github.com/robolibs/concord", tag = "v0.1.6" }
datapod = { git = "https://github.com/robolibs/datapod", tag = "0.6.2" }
graphix = { git = "https://github.com/robolibs/graphix", tag = "v0.1.6" }
geojson = "0.24"
pyo3 = { version = "0.23", optional = true, features = [
    "abi3-py39",
    "extension-module",
] }
rerun = { version = "0.31.2", default-features = false, features = ["sdk", "server"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]

[[example]]
name = "crs_conversion_example"
path = "examples/rust/crs_conversion_example.rs"

[[example]]
name = "json_roundtrip"
path = "examples/rust/json_roundtrip.rs"

[[example]]
name = "main"
path = "examples/rust/main.rs"

[[example]]
name = "read_write"
path = "examples/rust/read_write.rs"

[[example]]
name = "vector_workflow"
path = "examples/rust/vector_workflow.rs"
